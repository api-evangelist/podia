    type: Documentation
  - url: https://zapier.com/apps/podia/integrations
    type: Integrations
  description: >-
    Logical surface for Podia customers, email audience, and tags. No public
    REST API exists. Through Zapier, Podia can add someone to your audience and
    subscribe them for email, apply and react to tags ("Someone Gets Tagged"),
    and add people to a product waitlist ("Someone Waitlists"). Endpoints are
    modeled from these Zapier triggers and actions rather than a documented API.
