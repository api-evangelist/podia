    type: Documentation
  - url: https://zapier.com/apps/podia/integrations
    type: Integrations
  description: >-
    Logical surface for Podia sales and orders. No public REST API or webhook
    is available to receive order data. Zapier surfaces a "New Sale" trigger
    that fires when someone purchases a free or paid course or digital download,
    which is the only supported way to react to a transaction programmatically.
    Endpoints are modeled from that Zapier trigger, not a documented API.
