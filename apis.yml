    type: Integrations
  description: >-
    Logical surface for Podia products - online courses, digital downloads,
    coaching, and webinars. Podia does not expose a public REST API for
    products; enrollment can only be automated through the Zapier "Sign Someone
    Up for a Product" action and the "Product Signed Up For" trigger (write
    actions require the Shaker plan). Endpoints are modeled from those Zapier
    capabilities, not fetched from a first-party API reference.
