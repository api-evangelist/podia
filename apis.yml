name: Podia
kind: company
description: >-
  Podia is an all-in-one creator platform for selling online courses, digital
  downloads, coaching, webinars, and memberships, with a website builder, blog,
  communities, and built-in email marketing. As of this review, Podia does NOT
  offer a public or partner developer API and does not expose webhooks. The
  company's own help center states plainly that "Podia does not offer a public
  API or webhooks," and directs builders to Zapier as the only supported
  integration path. The logical resources below (products, customers/audience,
  community, and sales) are therefore documented as endpointsModeled - they
  reflect the objects and events Podia surfaces through its Zapier app, not a
  first-party REST API. There is no published base URL, authentication scheme,
  or OpenAPI description to catalog. What Podia does publish, and what this
  profile captures, is a real client-side surface: an Advanced JavaScript
  tracking API exposing Podia.Customer and Podia.Conversion objects plus three
  DOM CustomEvents on every storefront page, an embeddable email-capture form
  that POSTs to a per-creator subscriptions endpoint, and a 509-link llms.txt at
  help.podia.com that renders every help article as markdown. Podia also runs a
  public Atlassian status page and a Beamer changelog, and allows GPTBot,
  ClaudeBot and PerplexityBot in robots.txt - the missing agent surface here is a
  missing API product, not an anti-AI posture.
