title: What's new on Podia
description: >-
  Podia runs a public product changelog at changelog.podia.com, hosted on Beamer
  (app.getbeamer.com). The page is real and public - HTTP 200, og:title
  "What's new on Podia", with announcement and improvement category filters - but
  every entry title and body is injected client-side by Beamer's JavaScript, so
  the served HTML contains empty <h3 class="featureTitle"> shells and no dates.
  The Beamer RSS/Atom endpoints are blocked at Podia's Cloudflare edge (403), so
  there is no machine-readable path to the entries at all.
