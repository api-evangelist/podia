method: searched
source: https://zapier.com/apps/podia/integrations
also_source: https://help.podia.com/en/articles/11370276-connecting-podia-to-other-platforms-using-zapier
description: >-
  Podia's ONLY supported programmatic integration path. Podia publishes no API and
  no webhooks; the help center directs every builder to Zapier instead. This file
  catalogs the real trigger and action surface of the Podia Zapier app, because it
  is the closest thing Podia has to a documented event and write surface - and
  because the four modeled API entries in apis.yml are modeled from exactly these
  capabilities, not from any Podia API reference.
important: >-
  These are NOT webhooks. A Zapier trigger is consumed inside Zapier's platform;
  Podia does not let a developer register a callback URL of their own, and no
  Webhooks pointer is emitted for this surface. Authentication is a Zapier-brokered
  account login to Podia, not an API key or OAuth client a developer can obtain.
access:
  auth: Zapier-brokered Podia account authorization (no developer credential is issued)
  plan_gating:
    triggers: Shaker and Earthquaker plans
    actions: Shaker and Earthquaker plans
    source: https://help.podia.com/en/articles/11370276-connecting-podia-to-other-platforms-using-zapier
    note: >-
      Corrected 2026-08-13. Podia's current Zapier documentation gates BOTH
      triggers and actions to Shaker and Earthquaker. An earlier round of this
      profile recorded triggers as available on Mover; that is no longer what the
      docs say.
triggers:
- name: Product Signed Up For
  description: Triggers when someone signs up for a free or paid product.
  entity: Product
  docs: https://help.podia.com/en/articles/11370354-signing-someone-up-for-a-product-using-zapier
- name: Someone Joins Community
  description: Triggers when someone joins a free or paid community plan.
  entity: CommunityPlan
  docs: https://help.podia.com/en/articles/11370884-configuring-a-someone-joins-community-trigger-using-zapier
- name: Someone Leaves Community
  description: Triggers when a community member cancels their plan.
  entity: CommunityPlan
  docs: https://help.podia.com/en/articles/11370896-configuring-a-someone-leaves-community-trigger-using-zapier
- name: Someone Waitlists
