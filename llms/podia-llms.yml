title: Podia Help Center
description: >-
  Podia publishes a real llms.txt at https://help.podia.com/llms.txt - a 509-link
  index of the entire Podia Help Center, each entry pointing at a machine-readable
  .md rendering of the article (append .md to any help.podia.com article URL and
  Intercom serves clean markdown). This is the single richest machine-readable
  surface Podia ships. It is a documentation index, not an API contract: it
  contains no endpoints, no schemas and no authentication model, because Podia
  does not publish an API. Saved verbatim.
