- title: Does Podia have a public API or webhooks?
  url: https://help.podia.com/en/articles/11371075-does-podia-have-a-public-api-or-webhooks.md
  note: >-
    The authoritative statement. Verbatim: "Podia does not offer a public API or
    webhooks." Directs builders to Zapier as the only supported programmatic path.
- title: Advanced JavaScript tracking API
  url: https://help.podia.com/en/articles/11371023-advanced-javascript-tracking-api.md
  note: >-
    The only first-party programmable interface Podia documents - browser-side
    Podia.Customer / Podia.Conversion objects and three DOM CustomEvents.
    Captured in components/podia-components.yml and data-model/podia-data-model.yml.
- title: Connecting Podia to other platforms using Zapier
  url: https://help.podia.com/en/articles/11370276-connecting-podia-to-other-platforms-using-zapier.md
